[custom]
; ----------------------------------------------------------
; 0. 节点清洗
;    注意: subconverter 只认 exclude_remarks=，写成 exclude= 会被静默忽略
;    正则默认区分大小写，必须带 (?i)
; ----------------------------------------------------------
exclude_remarks=(?i)(流量|套餐|到期|剩余|重置|过期|续费|官网|网站|最新网址|防失联|失联|公告|通知|电报|群|频道|说明|使用说明|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website)

enable_rule_generator=true
overwrite_original_rules=true

; ----------------------------------------------------------
; 1. 私网直连（GEOIP,LAN 各内核通用，比 private 更稳）
; ----------------------------------------------------------
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,LAN,no-resolve

; ----------------------------------------------------------
; 2. Aethersailor 直连补丁（置顶：用精确条目覆盖后面的分流）
; ----------------------------------------------------------
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800

; ----------------------------------------------------------
; 3. 国内直连（统一走 ➡️ 国内 组，默认 DIRECT，需要时可整组切代理）
; ----------------------------------------------------------
ruleset=➡️ 国内,[]GEOSITE,cn
ruleset=➡️ 国内,[]GEOIP,CN,no-resolve
ruleset=➡️ 国内,[]GEOSITE,google-cn
ruleset=➡️ 国内,[]GEOSITE,category-games@cn
ruleset=➡️ 国内,[]GEOSITE,category-game-platforms-download
ruleset=➡️ 国内,[]GEOSITE,category-public-tracker

; ----------------------------------------------------------
; 4. 应用分流（自上而下，先到先得）
; ----------------------------------------------------------
; 4.1 AI
ruleset=✨ ChatGPT,https://raw.githubusercontent.com/ma-wenqian/ai-proxy-rules/refs/heads/main/rules/openai.list
ruleset=✨ Claude,https://raw.githubusercontent.com/ma-wenqian/ai-proxy-rules/refs/heads/main/rules/claude.list
ruleset=✨ Grok,https://raw.githubusercontent.com/myrules335/URL/refs/heads/main/Grok.list
ruleset=✨ AI-others,https://raw.githubusercontent.com/myrules335/URL/refs/heads/main/AI-others.list
ruleset=✨ Gemini,https://raw.githubusercontent.com/myrules335/URL/refs/heads/main/Gemini.list
; 4.2 搜索 / 流媒体
ruleset=🔍 Google,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Google/Google.list
ruleset=🎞️ YouTube,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list
ruleset=📺 Disney,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Disney/Disney.list
ruleset=🎥 Netflix,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.list
ruleset=🎬 HBO,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/HBO/HBO.list
ruleset=🎵 Spotify,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.list
; 4.3 苹果 / 内容
ruleset=🍎 Apple Intelligence,https://raw.githubusercontent.com/ma-wenqian/ai-proxy-rules/main/rules/apple-intelligence.list
ruleset=🍎 Apple,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Apple/Apple.list
ruleset=Japan AV,https://raw.githubusercontent.com/myrules335/URL/refs/heads/main/Japan-AV.list
ruleset=R18,https://raw.githubusercontent.com/myrules335/URL/refs/heads/main/R18.list
ruleset=News,https://raw.githubusercontent.com/myrules335/URL/refs/heads/main/news.list
; 4.4 社交 / 开发 / 电商
ruleset=📘 GitHub,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/GitHub/GitHub.list
ruleset=🪂 TikTok,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/TikTok/TikTok.list
